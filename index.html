<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap');

    * {
        font-family: 'Roboto Mono', monospace;
        color: #ffffff;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        user-select: none;
    }

    body {
        background-color: rgb(17, 17, 27);
        overflow: hidden;
        margin: 0;
        height: 100vh;
    }

    .center {
        margin: 0;
        top: 50%;
        left: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .box {
        width: 90%;
        max-width: 400px;
        height: auto;
        background-color: rgb(30, 30, 46, 0.5);
        border-radius: 1px;
        border: 2px solid rgb(108, 112, 134);
        color: aqua;
        padding: 10px;
        margin-bottom: 10px;
        transition: border-color 0.2s ease;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    .box:hover {
        border-color: rgb(255, 255, 255);
    }

    .box-buttons {
        width: 90%;
        max-width: 400px;
        height: auto;
        background-color: rgb(30, 30, 46, 0.5);
        border-radius: 1px;
        border: 2px solid rgb(108, 112, 134);
        color: aqua;
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
        margin-bottom: 10px;
        gap: 8px;
        transition: border-color 0.2s ease;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    .box-buttons:hover {
        border-color: rgb(255, 255, 255);
    }

    .header-container {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .pfp {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 2px solid rgb(108, 112, 134);
        object-fit: cover;
    }

    .button {
        width: auto;
        height: auto;
        background-color: rgb(30, 30, 46, 0.2);
        border-radius: 1px;
        border: 2px solid rgb(108, 112, 134);
        color: aqua;
        padding: 10px;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    footer {
        text-align: center;
        font-size: 15px;
        opacity: 0.2;
    }

    .mutebutton {
        width: 40px;
        height: 40px;
        background-color: rgb(30, 30, 46, 0.2);
        border-radius: 1px;
        border: 2px solid rgb(108, 112, 134);
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 10px;
        left: 10px;
    }

    .clicktoenter {
        width: 100vw;
        height: 100vh;
        background-color: rgba(17, 17, 27, 0.6);
        position: fixed;
        top: 0;
        left: 0;
        transition: background-color 0.2s ease;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        text-align: center;
        line-height: 100vh;
        font-size: 20px;
        z-index: 10000;
    }

    .clicktoenter:hover {
        background-color: rgba(78, 82, 94, 0.6);
    }

    .mutebutton:hover {
        background-color: rgb(78, 82, 94);
        border-color: rgb(255, 255, 255);
        cursor: pointer;
    }

    .button-icon {
        width: 18px;
        height: 18px;
        filter: invert(72%) sepia(82%) saturate(3026%) hue-rotate(133deg) brightness(101%) contrast(102%);
    }

    .button:hover {
        background-color: rgb(108, 112, 134);
        border-color: rgb(255, 255, 255);
    }
</style>

<head>
    <title>my corner</title>
</head>

<body>
    <div class="center">
        <div class="box">
            <div class="header-container">
                <img id="pfp" class="pfp" src="" alt="pfp">
                <div class="header-text">
                    <p style="font-size: 24px; font-weight: bold;">satu</p>
                    <p id="discordusername">@satu_2</p>
                    <p id="time" style="opacity: 0.7; font-size: 12px;"></p>
                </div>
            </div>
        </div>
        <div class="box">
            <p id="status"><b>status</b>: hold on</p>
        </div>
        <div class="box">
            <p>i'm satu</p>
            <p>aka: saturn, satucat, onecat</p>
            <p>i know: html, css, luau, and python</p>
            <p>my favourite language is python</p>
        </div>
        <div class="box-buttons">
            <a id="discordlink" href="https://discord.com/users/0" target="_blank">
                <button class="button">
                    <img src="assets/logos/discord.svg" alt="icon" class="button-icon" id="discordbutton">
                    satu_2
                </button>
            </a>
            <a href="https://t.me/saturncat06" target="_blank">
                <button class="button">
                    <img src="assets/logos/telegram.svg" alt="icon" class="button-icon">
                    saturncat06
                </button>
            </a>
            <a href="https://www.roblox.com/users/970445711/profile" target="_blank">
                <button class="button">
                    <img src="assets/logos/roblox.svg" alt="icon" class="button-icon">
                    SaturnOnSchoolWiFi
                </button>
            </a>
            <!--
            Here lies AH:RE
            I quit working on it.
            <a href="https://www.roblox.com/games/84910985279714/Admin-House-Reimagined" target="_blank">
                <button class="button">
                    <img src="assets/logos/home.svg" alt="icon" class="button-icon">
                    AH:RE (Roblox game)
                </button>
            </a>
            -->
        </div>
        <div class="box-buttons">
            <a href="https://tianjo.cc/satu" target="_blank">
                <button class="button" id="tianjobutton">
                    <img src="assets/logos/tianjo.png" alt="icon" class="button-icon">
                    tianjo
                </button>
            </a>
            <a href="https://satu.zip" target="_blank">
                <button class="button">
                    <img src="assets/logos/zipline.svg" alt="icon" class="button-icon">
                    zipline
                </button>
            </a>
        </div>
        <footer id="nowplaying">
            <p>now playing: -</p>
        </footer>
    </div>
    <div class="clicktoenter" id="clicktoenter">
        <p>click me</p>
    </div>
    <button class="mutebutton" id="mutebutton">
        <img id="mute-icon" src="assets/images/music.svg" alt="icon" class="button-icon">
    </button>
    <audio id="music" src="assets/Waiting - leverfall.wav" preload="auto" loop="true" hidden></audio>
    <script>
        var cte = document.getElementById("clicktoenter");
        cte.style.backdropFilter = "blur(12px)";
        cte.style.webkitBackdropFilter = "blur(12px)"; // fuck safari

        var muteBtn = document.getElementById("mutebutton"); // autocomplete did this one for me
        const tianjo = document.querySelector("#tianjobutton .button-icon");
        if (tianjo) {
            tianjo.style.filter = "none";
        }
        var muteIcon = document.getElementById("mute-icon");
        var music = document.getElementById("music");
        var nowplaying = document.getElementById("nowplaying");

        const discordid = "1243538246722388000"; // If you're taking my src for yourself, change this. (u must join discord.gg/lanyard for it)

        async function getavatarhash() {
            try {
                const req = await fetch(`https://api.lanyard.rest/v1/users/${discordid}`);
                const data = await req.json();
                console.log("got: " + data.data["discord_user"]["avatar"]);
                return data.data["discord_user"]["avatar"];
            }
            catch {
                console.log("can't get hash!")
                return
            }
        }

        async function getcurrentuser() {
            try {
                const req = await fetch(`https://api.lanyard.rest/v1/users/${discordid}`);
                const data = await req.json();
                console.log(data.data["discord_user"]["username"]);
                return data.data["discord_user"]["username"];
            }
            catch {
                console.log("can't get username!");
                return
            }
        }

        async function updateclock() {
            const rn = new Date();

            const londontime = rn.toLocaleTimeString("en-GB", {
                timeZone: "Europe/London",
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            document.getElementById("time").innerText = "for me, it's " + londontime;
        }
        updateclock();
        setInterval(updateclock, 1000);

        cte.addEventListener("click", function () {
            cte.animate(
                [{ opacity: 1 }, { opacity: 0 }],
                { duration: 200, fill: 'forwards' }
            );
            setTimeout(() => {
                cte.style.display = "none";
            }, 600);
            music.play();
            music.volume = 0.3;
            let fileName = decodeURIComponent(music.src.split("/").pop());
            nowplaying.innerHTML = `<p>${fileName}</p>`;
        });

        // the magic function that gets your pfp (and username)
        (async function () {
            let hash = await getavatarhash();
            if (hash) {
                document.getElementById("pfp").src = `https://cdn.discordapp.com/avatars/${discordid}/${hash}.png?size=4096`;
            } else {
                document.getElementById("pfp").src = "assets/images/pfp.png";
            }
            let name = await getcurrentuser();
            if (name) {
                document.getElementById("discordbutton").innerHTML = "<img src=\"assets/logos/discord.svg\" alt=\"icon\" class=\"button-icon\">" + name;
                document.getElementById("discordusername").innerHTML = "@" + name;
            } else {
                document.getElementById("discordbutton").innerHTML = "<img src=\"assets/logos/discord.svg\" alt=\"icon\" class=\"button-icon\">" + "can't fetch!";
                document.getElementById("discordusername").innerHTML = "@null";
            }
            const req = await fetch(`https://api.lanyard.rest/v1/users/${discordid}`);

            const userdata = await req.json();
            console.log(userdata.data);
            if (userdata.data["discord_user"].id) {
                document.getElementById("discordlink").href = `https://discord.com/users/${userdata.data["discord_user"].id}`;
                console.log("got id! " + userdata.data["discord_user"].id);
            } else {
                document.getElementById("discordlink").href = "https://discord.com/users/0";
                console.log("couldn't get id");
            }
            console.log(userdata.data.discord_status)
            if (userdata.data.discord_status) {
                if (userdata.data.discord_status == "idle") {
                    document.getElementById("status").innerHTML = "<b>status</b>: online";
                } else {
                    document.getElementById("status").innerHTML = "<b>status</b>: " + userdata.data.discord_status;
                }
            } else {
                document.getElementById("status").innerHTML = "<b>status</b>: offline";
            }
        })();

        muteBtn.addEventListener("click", function () {
            if (music.paused) {
                music.play();
                muteIcon.src = "assets/images/music.svg";
            }
            else {
                music.pause();
                muteIcon.src = "assets/images/mute.svg";
            }
        });

        tianjobutton.style.transition = "none";
    </script>

    <!-- load vanta -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>

    <!-- actually get vanta up -->
    <script>
        // Source - https://stackoverflow.com/a/2035211
        // Posted by Leo, modified by community. See post 'Timeline' for change history
        // Retrieved 2026-09-20, License - CC BY-SA 2.5

        // thanks leo

        function getViewport() {
            let viewPortWidth;
            let viewPortHeight;

            // the more standards compliant browsers (mozilla/netscape/opera/IE7) use window.innerWidth and window.innerHeight
            if (typeof window.innerWidth != 'undefined') {
                viewPortWidth = window.innerWidth,
                    viewPortHeight = window.innerHeight
            }

            // IE6 in standards compliant mode (i.e. with a valid doctype as the first line in the document)
            else if (typeof document.documentElement != 'undefined'
                && typeof document.documentElement.clientWidth !=
                'undefined' && document.documentElement.clientWidth != 0) {
                viewPortWidth = document.documentElement.clientWidth,
                    viewPortHeight = document.documentElement.clientHeight
            }

            // older versions of IE
            else {
                viewPortWidth = document.getElementsByTagName('body')[0].clientWidth,
                    viewPortHeight = document.getElementsByTagName('body')[0].clientHeight
            }
            return [viewPortWidth, viewPortHeight];
        }

        VANTA.CELLS({
            el: "body",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: getViewport()[1], // so vanta didn't work on some devices. i was previously doing 1920x1080 (dumbass)
            minWidth: getViewport()[0],
            scale: 1.00,
            color1: 0x7a57b3,
            color2: 0x21306b
        })
    </script>
</body>
